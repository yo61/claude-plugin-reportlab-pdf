version: 2
updates:
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # Pin the prefix rather than relying on Dependabot's auto-detection, so
    # its commits satisfy commitlint now that they are no longer ignored.
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      hooks:
        patterns: ["*"]
